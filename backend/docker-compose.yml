version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: carelink-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: carelink_telemedicine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: carelink-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/carelink_telemedicine?schema=public"
      JWT_SECRET: "carelink_super_secret_jwt_key_rural_telemedicine_2026"
      JWT_REFRESH_SECRET: "carelink_super_secret_refresh_key_2026"
      CORS_ORIGIN: "http://localhost:5173,capacitor://localhost"
      STORAGE_ROOT: "/app/storage"
    volumes:
      - ./storage:/app/storage
    depends_on:
      - postgres

volumes:
  postgres_data:
